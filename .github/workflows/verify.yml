name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4

      - name: Verify
        run: just verify

  verify-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Smoke
        run: just smoke

      - name: Install @wrkf/client dependencies
        run: just wrkf-client-install

      - name: Verify RPC
        run: just verify-rpc
