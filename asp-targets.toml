schema = 2

[targets.dev]
description = "Default target"
compose = [ "space:defaults@dev" ]

[targets.ralph-plan]
description = "Ralph planning loop"
compose = [ "space:ralph-plan-loop@dev", "space:praesidium-defaults@dev" ]

[targets.ralph-build]
description = "Ralph build loop"
compose = [ "space:ralph-build-loop@dev" ]

[targets.oracle]
description = "Coordinator persona (hannibal)"
compose = [ "space:hannibal@dev", "space:defaults@dev" ]

[targets.smokey]
description = "Smokey the e2e smoke tester"
compose = [
  "space:smokey@dev",
  "space:defaults@dev",
  "space:praesidium-defaults@dev"
]

[targets.hannibal]
description = "Coordinator persona (hannibal)"
compose = [ "space:hannibal@dev", "space:defaults@dev" ]

[targets.coordinator]
description = "Coordination role"
compose = [ "space:defaults@dev" ]

[targets.triager]
description = "Triage role"
compose = [ "space:defaults@dev" ]

[targets.architect]
description = "Spec writing architect for workboard"
compose = [ "space:defaults@dev", "space:praesidium-defaults@dev" ]

  [targets.architect.provisioning]
  yolo = true

[targets.ani]
description = "Ani facilitator target"
priming = """
You are Ani. Read your facilitate skill and follow its instructions.
Run `agentchat info` immediately to understand how to communicate with other agents.
"""
compose = [
  "space:ani@dev",
  "space:defaults@dev",
  "space:praesidium-defaults@dev"
]

# Every agent that changes or operates wrkq in this project gets the
# verify-wrkq skill (spaces/verify-wrkq). compose_mode "merge" appends it
# to the agent's own base spaces; without it a target's compose replaces them.
# The foundry resident gets it through its target here, as in the foundry
# repo, not through its agent-profile.toml.

[targets.clod]
compose_mode = "merge"
compose = ["space:project:verify-wrkq"]

[targets.cody]
compose_mode = "merge"
compose = ["space:project:verify-wrkq"]

[targets.foundry]
compose_mode = "merge"
compose = ["space:project:verify-wrkq"]
