last_verified:
  date: 2026-07-24
  evidence: "T-06652 added the cataloged/fingerprinted wrkq.container.taskCounts producer/client slice: focused API/workrpc/client tests, pagination-equivalence coverage, authenticated local-vs-rpc:// parity, full just verify, and an isolated scratch-prefix installed-binary drive all green. Prior terminalization/shared-client evidence remains T-06755..T-06761 plus T-06783 at 33c598a."
reopen_when:
  - WRKF_* code set changes
  - retryable semantics change
  - JSON-RPC error envelope changes
  - wrkf.workflow.discontinue or wrkf.workflow.reinstate names, params, or result DTO change
  - attachDiscontinued moves off wrkq.workflow.attach or stops crossing @wrkq/client
  - wrkq.project listView/root DTO or setRoot name, params, CAS, attribution, or result changes
  - the project-root producer/client slice diverges from wrkq.project-root-registry
  - wrkf.instance.cancel or wrkf.suspension.resolve terminalization names, params, result DTOs, state/revision gates, or token-free summaries change
  - registry, schema hash, CLI, or @wrkq/client diverges from the instance-terminalization producer surface
  - wrkq.container.taskCounts name, params, identity fields, inclusion semantics, completeness, or typed client facade changes
