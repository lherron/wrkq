id: wrkq.contract.wrkf-rpc
kind: contract
status: active
owner_project: wrkq
scope: wrkq/wrkf JSON-RPC wire + error-recovery contract
predicate: >
  wrkf RPC errors carry a stable WRKF_* code and a boolean retryable; codes and
  retryability are canonical here and preserved across the JSON-RPC boundary to
  clients. The template-lifecycle producer additions are likewise frozen across
  the server catalog, named DTOs, schema hash, and `@wrkq/client`:
  `wrkf.workflow.discontinue|reinstate` accept `{ref, principal_ref?}` and return
  the extended `WorkflowShowResult`, while `attachDiscontinued` belongs only to
  `wrkq.workflow.attach`. The project-root registry producer/client slice is
  likewise frozen: `wrkq.project.listView` returns project entries with explicit
  nullable `root`; dedicated `wrkq.project.setRoot {project, root,
  expectEtag?, actor?}` stores/returns root verbatim, clears on empty, applies
  canonical caller attribution, and preserves root, etag, attribution, and
  event history on stale CAS. `@wrkq/client` exposes the matching project
  facade and DTOs, as governed by `wrkq.project-root-registry`.
  The shared Go client transport preserves the same initialize/schema/auth/error
  contract for both wrkq and wrkf in local InProcess and remote HTTP modes.
  Wrkf template operations carry bounded template content rather than daemon-local
  caller paths; watch uses bounded snapshot/event pages; and the S4 method set
  (`wrkq.workflow.syncMeta`, `wrkf.evidence.schema`, `wrkf.supervisor.call`,
  `wrkf.supervisor.escalate`, `wrkf.obligation.create`) remains present in the
  registry, schema hash, and typed client.
  Instance terminalization is frozen across the same surfaces:
  `wrkf.instance.cancel` applies ordinary selector/revision gates to an active
  unsuspended instance, atomically revokes every active run while closing the
  instance, and returns token-free terminalized-run summaries. Suspension
  `resume` preserves active run authority; suspension `close|cancel` use the
  same atomic terminalization fence.
  The producer-owned container-count aggregate is frozen across the same
  registry/schema/client boundary: `wrkq.container.taskCounts
  {includeArchived?}` returns one complete unpaginated read-transaction snapshot
  with stable container/project identity, non-deleted total subtree counts, and
  idea/draft/open/in_progress/blocked active subtree counts.
