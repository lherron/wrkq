last_verified:
  date: 2026-07-24
  evidence: "T-06124 at 212d66f added the cataloged/fingerprinted wrkq.workflow.instances producer/client slice (schema hash sha256:0a3a6c70d97d3ce38ccace1a33cc8b920990c7e757d709991f797cad011fd6f9): isolated scratch-prefix branch binaries with an explicit catalog, authenticated matching daemon/stdio, and real @wrkq/client proved empty, unknown, multi-generation order, inspect agreement, and local/remote parity; full just verify, pre-push verify, and just smoke were green. Daedalus independently inspected the sources, reran the four focused Go guards plus client typecheck/fake-transport tests, drove the isolated branch binary against the scratch DB for empty/multi/inspect/unknown behavior, and passed post-amendment just verify before activation. Prior container-count, terminalization, and shared-client evidence remains T-06652 and T-06755..T-06761 plus T-06783."
reopen_when:
  - WRKF_* code set changes
  - retryable semantics change
  - JSON-RPC error envelope changes
  - wrkf.workflow.discontinue or wrkf.workflow.reinstate names, params, or result DTO change
  - attachDiscontinued moves off wrkq.workflow.attach or stops crossing @wrkq/client
  - wrkq.project listView/root DTO or setRoot name, params, CAS, attribution, or result changes
  - the project-root producer/client slice diverges from wrkq.project-root-registry
  - wrkf.instance.cancel or wrkf.suspension.resolve terminalization names, params, result DTOs, state/revision gates, or token-free summaries change
  - registry, schema hash, CLI, or @wrkq/client diverges from the instance-terminalization producer surface
  - wrkq.container.taskCounts name, params, identity fields, inclusion semantics, completeness, or typed client facade changes
  - wrkq.workflow.instances name, namespace, params, named envelope, known-empty versus unknown semantics, generation inclusion/order, inspect element-zero agreement, or absence of wrkf.task.instances changes
  - task instances CLI local/rpc parity, method/DTO catalog/schema hash, or @wrkq/client facade/error mapping diverges from the generation-history producer surface
