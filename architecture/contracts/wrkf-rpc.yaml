  - internal/workrpc/errors.go            # maps typed codes onto JSON-RPC
  - internal/workrpc/error_mapping_contract_test.go
  - internal/workrpc/codec_contract_test.go
  - internal/workrpc/entrypoint_equivalence_test.go
  - internal/workrpc/registry.go
  - internal/workrpc/client/transport.go
  - internal/workrpc/client/local.go
  - internal/workrpc/workflow_discontinued_acceptance_test.go
  - internal/workrpc/project_root_test.go
  - internal/wrkqapi/projectroots.go
  - internal/wrkqapi/projectsview.go
  - internal/wrkfapi/api.go
  - internal/wrkfapi/types.go
  - internal/wrkfapi/gaps.go
  - internal/wrkfcli/transport.go
  - internal/wrkfcli/importguard_test.go
  - packages/client/src/errors.ts         # client preserves data.code + retryability
  - packages/client/src/client.ts
  - packages/client/src/wrkq/facade.ts
  - packages/client/src/wrkf/facade.ts
  - packages/client/src/wrkf/types.ts
  - packages/client/src/wrkq/types.ts
  - packages/client/test/fake-transport.test.ts
  - packages/client/test/workflow-template-discontinue-contract.test.ts
  - docs/wrkf-rpc.md                      # explanatory projection (companion)
  - docs/wrkq-wrkf-rpc.md
  - docs/wrkq-wrkf-rpc-client-forward-spec.md
  - architecture/records/contracts/wrkq.project-root-registry.yaml
  - architecture/records/contracts/wrkq.workflow.template-discontinuation.yaml
required_tests:
  - TestCodec_RequestRoundtrip
  - TestCodec_ResponseEncoding
  - TestCodec_ErrorResponseEncoding
  - TestCodec_MaxFrameSizeRejected
  - TestErrorMapper_StaleRevision
  - TestErrorMapper_Table
  - TestErrorMapper_NonDomainError
  - TestWorkflowDiscontinueRPCAndAttachOverrideContract
  - TestWorkflowDiscontinueMethodsAreInRegistry
  - TestProjectRootRegistryOverRealRPC
  - TestProjectRootRegistryMethodIsRegistered
  - TestProjectRootSetRootStaleCASIsAtomic
  - TestProjectRootSetRootCanonicalAttributionAndInvalidIdentityNoOp
  - TestCommandAdapterImportGuard
  - TestLegacyDirectDBBootstrapCannotRegrow
  - TestEntrypointEquivalence
  - "bun test packages/client/test/fake-transport.test.ts"
  - "bun test packages/client/test/workflow-template-discontinue-contract.test.ts"
  - "packages/client (verify-rpc: client-test + client-integration)"
last_verified:
  date: 2026-07-21
  evidence: "T-06755..T-06761 shared-client migration, registry/DTO additions, template/hook isolation, import/entrypoint/golden guards, typed-client exact-version publish, and authenticated max3→mini installed proof green."
reopen_when:
  - WRKF_* code set changes
  - retryable semantics change
  - JSON-RPC error envelope changes
  - wrkf.workflow.discontinue or wrkf.workflow.reinstate names, params, or result DTO change
  - attachDiscontinued moves off wrkq.workflow.attach or stops crossing @wrkq/client
  - wrkq.project listView/root DTO or setRoot name, params, CAS, attribution, or result changes
  - the project-root producer/client slice diverges from wrkq.project-root-registry
supersedes: []
