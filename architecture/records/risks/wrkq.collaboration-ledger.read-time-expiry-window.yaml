id: wrkq.collaboration-ledger.read-time-expiry-window
kind: accepted_risk
status: active
owner_project: wrkq
accepted_by: Lance
date: 2026-09-02
severity: low
blast_radius: >
  After an envelope's explicit expires_at deadline or its implicit undelivered
  horizon at created_at plus twenty-four hours, but before the next
  maintenance-bearing authoritative observation, raw storage can still say
  pending or deferred. The terminal event appears at first observation time
  rather than exactly at the deadline. LastN-only event cursor resolution is not
  such an observation.
mitigation: >
  Delivery, inbox, show, pendingView, monitor-state, and ordinary event-monitor
  paths check the server clock before acting or returning. Ordinary event pages
  fix and close their page and high-water before global maintenance, leaving new
  terminal events reachable by the next page. Presentation shares the
  transaction-local receipt, state, and deadline predicate with the global
  sweep, so a committed receipt exempts forever and no first receipt can cross a
  committed expiry. First-terminal-wins emits one terminal event.
expiry: null
review_trigger:
  - a consumer acts on raw pending state outside a maintenance-bearing authoritative observation
  - users require an event exactly at the deadline without a read
  - a background timer or independently scheduled sweeper is proposed for envelope expiry
reopen_when:
  - expiry materialization moves away from server-clock observation
  - presentation can record a first receipt after an applicable explicit or implicit deadline has committed
source:
  - wrkq:T-07871
  - internal/store/rooms.go
  - internal/wrkqapi/monitorview.go
  - internal/wrkqapi/rooms_admission_test.go
  - hrc-runtime:T-08401
