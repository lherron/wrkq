id: wrkq.simple-task.v1.naive-supersede
kind: accepted_risk
status: active
owner_project: wrkq
accepted_by: Lance
date: 2026-06-22
severity: medium
blast_radius: built-in wrkq-simple-task instances at any embedded version may evaluate under a replaced same id/version definition after EnsureBuiltinTemplate supersedes the stored definition
mitigation: >
  Treat same-version built-in supersede as an accepted operational recovery
  mechanism, not hash-pinned immutability. It is intentionally relied on to
  recover pre-existing wedged wrkq-simple-task@2/@3 operator_required
  instances after the operator_resolved lane is installed; historical event/run
  records remain append-only and are not rewritten.
expiry: null
review_trigger:
  - built-in workflow definitions stop using same-version supersede for recovery
  - old-instance divergence is observed
reopen_when:
  - built-in workflow migration semantics change
