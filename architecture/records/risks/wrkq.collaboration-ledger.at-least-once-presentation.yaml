id: wrkq.collaboration-ledger.at-least-once-presentation
kind: accepted_risk
status: active
owner_project: wrkq
accepted_by: Lance
date: 2026-07-22
severity: medium
blast_radius: >
  A crash between delivering an envelope's body to an HRC runtime and durably
  recording that presentation can cause the same envelope to be presented again.
  Stable presentation identity bounds the receipt, but it cannot make an agent's
  external side effects exactly-once; an agent may repeat work it completed
  before the crash.
  REVIEWED 2026-09-05 for hrc-runtime T-08094 (spec T-08092 rev 4), which
  changed the drive protocol — this record's third review trigger. The identity
  semantics and the guarantee are UNCHANGED: delivery remains at-least-once and
  envelope ids remain stable and visible. What changed is the WINDOW, and it
  narrowed. HRC now commits a durable delivery intent BEFORE calling any broker
  door, one envelope per submission, and writes the receipt only on a landing
  fact observed on the committed broker stream; an envelope with an open intent
  is not actionable, and reconcile replays the receipt under the same
  presentation id. So no HRC-side crash can redeliver at all. The residual
  window is entirely inside the broker: it APPLIES a body (applySteerNow /
  applyInputNow) before it EMITS input.accepted / submission.absorbed /
  submission.executed, so a broker failure in that interval delivers the body
  with no landing fact, and HRC's reconcile redelivers once after its submission
  TTL. That interval is the whole of the accepted risk now.
mitigation: >
  Envelope ids remain stable and visible through wrkc inbox/show/log, presentation
  state is durable in wrkq, and agents inspect the envelope before repeating an
  externally visible side effect. Duplicate presentation stays visible and
  recoverable rather than being silently treated as exactly-once delivery.
expiry: null
review_trigger:
  - a duplicate presentation causes a repeated external side effect
  - presentation identity stops being visible through wrkc inbox/show/log
  - the crash window or the delivery protocol changes
  - exactly-once agent side effects become a requirement
reopen_when:
  - presentation delivery guarantees change from at-least-once
  - envelope or presentation identity semantics change
  - the broker stops applying a body before emitting its landing fact, or starts
    emitting the landing fact first
source:
