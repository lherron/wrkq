id: wrkq.named-subtasks.v1
kind: contract
status: proposed
owner_project: wrkq
scope: named subtask identity, ownership, residency, collaboration and campaign context
predicate: >
  Named subtasks follow docs/named-subtasks-proposal.md revision 5, approved
  against f1310d9 in R-00240 on 2026-09-30. This record carries the approved
  design pending implementation; proposed status does not change active law
  or assert installed behavior.

  A subtask is an ordinary tasks row discriminated by subtask_owner_uuid,
  with a server-built owner-ID plus dot plus local-slug ID, no task-sequence
  allocation, and an immutable owner, slug and ID in v1. The owner is an
  ordinary task. Subtasks cannot own subtasks or child tasks, enroll in a
  campaign or directly attach a wrkf instance. parent_task_uuid and
  campaign_uuid are NULL. The composite ID is the existing scope's task token;
  scope grammar, role semantics and claim fencing remain unchanged.

  Subtask residency is materialized from its owner. Writers update only the
  owner's project_uuid; an AFTER UPDATE cascade on ordinary-task rows updates
  the subtasks. BEFORE INSERT and BEFORE UPDATE residency guards refuse
  divergent subtask values. Owners precede subtasks in snapshot import.
  Ownership uses ON DELETE RESTRICT. Direct and ancestor-container moves
  preserve ordinary-task claim behavior: claims do not prohibit relocation,
  task tokens remain stable, and old-project scopes are not rebound.

  One shared taskMemberFilter excludes subtasks from default container task
  membership, listings, counts, rollups and selection. Explicit subtask-aware
  reads opt in. Slugs are unique under the owner, including deleted records;
  ordinary task and sibling container slugs are disjoint. ID, UUID and full
  owner-path selectors identify the same subtask; bare slugs do not.

  Collaboration routes through the owner's effective room while preserving
  the subtask's exact envelope subject and caller/recipient scopes. Historical
  rooms and envelope replies retain their existing read and routing rules.
  Subtasks are never campaign members or independent portfolio counts. Their
  campaign event context follows the owner's resident-or-enrolled campaign,
  and their updated_at contributes to the owner's campaign member activity.
  Campaign admission does not apply to a subtask as an independent member.

  Owner completion reports open subtasks without refusing or mutating them.
  Deleted or archived owners refuse new subtask creation and claims, while
  existing conversations remain readable and replyable. Subtask or owner
  purge is refused when ownership exists. Ordinary child-task semantics remain
  governed by wrkq.task-hierarchy.cross-project-parents.

  Create RPC fields are subtaskOwner plus required slug; path, project,
  parentTask and campaign are refused with subtaskOwner, and slug is refused
  without it. Producer catalog and Go/TypeScript clients change together.
  Fleet-wide ID-consumer, placement and prune fixes activate before creation.
  Slice 2 couples behavior to amendments of wrkq.task-hierarchy.cross-project-parents,
  wrkq.collaboration-ledger.authority, wrkq.task-view.caller-state-selection
  and wrkq.campaign.canonical-portfolio-authority. Slice 3 is documentation.
authority:
  repo: wrkq
  surface: tasks schema and wrkq task, room, campaign and RPC producer surfaces
consumers:
  - wrkq and wrkc
  - HRC task sessions, placement and worktree pruning
  - ACP and taskboard
  - Go and TypeScript wrkq clients
enforced_by: >
  Approved revision-5 design; implementation and installed acceptance are
  pending. Promote only with delivered guards and acceptance evidence, and
  amend the four affected active records with slice 2's behavior.
source:
  - docs/named-subtasks-proposal.md
  - architecture/records/invariants/wrkq.task-hierarchy.cross-project-parents.yaml
  - architecture/records/invariants/wrkq.collaboration-ledger.authority.yaml
  - architecture/records/invariants/wrkq.task-view.caller-state-selection.yaml
  - architecture/records/invariants/wrkq.campaign.canonical-portfolio-authority.yaml
  - architecture/records/invariants/wrkq.task-claim.authority.yaml
  - architecture/records/invariants/wrkq.attribution.caller-principal-exact.yaml
  - architecture/records/invariants/wrkq.rpc.remote-transport-locator.yaml
required_tests:
  - Revision 5 installed acceptance scenarios 1 through 17 with transcripts, JSON, database and event readback, and session references
  - Fleet-wide placement and live-subtask owner-worktree prune acceptance before subtask creation activates
  - Real-migration owner cascade, divergent subtask insert and update refusal, and same-project and cross-project movement acceptance
  - Resident and enrolled campaign owner parity for membership, activity, event context and terminal-campaign subtask creation
last_verified: null
reopen_when:
  - subtask identity, ownership, slug immutability or scope-token semantics change
  - residency becomes caller-maintained or can diverge from the owner
  - subtasks become default container members, rollup inputs or campaign members
  - owner room routing loses exact subtask subjects, scopes or historical replies
  - owner completion becomes gated by subtasks or mutates their lifecycle
  - ownership permits purge, reparenting, renaming or promotion
  - creation activates before fleet-wide placement and prune safety is delivered
  - implementation changes the four active predicates without their coupled amendments
supersedes: []
superseded_by: null
