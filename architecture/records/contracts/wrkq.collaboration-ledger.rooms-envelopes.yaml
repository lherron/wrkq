  - architecture/records/invariants/wrkq.collaboration-ledger.authority.yaml
  - architecture/records/invariants/wrkq.attribution.caller-principal-exact.yaml
  - architecture/records/risks/wrkq.collaboration-ledger.at-least-once-presentation.yaml
  - architecture/records/risks/wrkq.collaboration-ledger.same-uid-disposition-confusion.yaml
