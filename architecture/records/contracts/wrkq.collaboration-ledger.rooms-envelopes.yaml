id: wrkq.collaboration-ledger.rooms-envelopes
kind: contract
status: proposed
owner_project: wrkq
scope: room, envelope, membership, and presentation-receipt storage plus the wrkq.room/wrkq.envelope RPC surface
predicate: >
  A room is a durable conversation keyed by a work identity and created lazily
  on the first say. Campaign, task, and project rooms anchor on exactly one live
  wrkq resource and carry no friendly id: their key IS the work identity, which
  is what puts a task's state changes and its conversation on one monitor
  selector. Ad-hoc rooms anchor on nothing and mint `R-\d{5}`.

  A room has NO lifecycle state and nothing about a room can refuse a say: a say
  into any room the caller can resolve writes, whatever its work, its activity,
  or its labels. `work` and `activity` are read-time projections that are never
  stored and never gate. `work` is open or terminal from the anchored task or
  campaign, and open for ad-hoc rooms. `last_activity` is the maximum of the
  room's opened_at, its newest envelope's created_at, and its newest member's
  joined_at, so it is total for every room including one opened explicitly and
  never spoken in. `activity` is single-valued and total by first match: stale
  iff work is terminal and last_activity is older than four hours, else active
  under twenty-four hours, else quiet. Every consumer keys on that one value:
  the default room listing omits stale, ad-hoc pair-room reuse takes the active
  exact-pair room and otherwise opens a new one, and a say into a stale room
  returns an advisory notice that is never an error and has no override. The
  `hidden` label, settable by any principal, removes a room from the default
  listing only.

  An envelope is one object for chat and, when reply_required, obligation,
  addressed to exactly ONE
  recipient, minted `EN-\d{5}` — not `EV-`, which evidence_items already owns
  and exposes through wrkf.evidence.show. A multi-addressee say fans out to one
  envelope per addressee in ONE transaction sharing a group id equal to the
  first envelope's own id, so every lifecycle field is per envelope and one
  recipient's reply, defer, failure, expiry, or withdrawal never disposes or pauses another's
  obligation. The say's idempotency key rides every envelope of the fan-out and
  is unique per (key, addressee), so a retried say rolls the whole group back
  rather than half-writing it. The live obligation vocabulary is exactly none,
  fyi, and reply_required. An addressee-less none say is disposed at write.
  Addressed fyi never births an unborn scope and never gates; when a seat exists
  it is injected and acked at its own presentation. reply_required births,
  wakes, advances to presented, and remains owed.

  expires_at is a server-normalized immutable creation attribute. A due pending
  or deferred envelope with no presentation receipt materializes once as
  terminal expired on the next authoritative inbox, show, pendingView, present,
  or envelope-monitor observation; a receipt permanently excludes expiry.
  delivery is the other immutable attribute, queue by default or hold. wrkq
  stores and projects delivery but never routes or actuates it; HRC's kicker is
  its named reader and decides whether hold reaches its preempt admission door.

  Sender withdrawal changes an unpresented pending or deferred envelope to
  terminal withdrawn. Presentation and withdrawal reciprocally guard each other
  inside their transactions. A group withdrawal commits one complete per-member
  result atomically. A reply without an explicit discharge set retains the wide
  rule. A reply with dischargeEnvelopeIds validates the whole set and atomically
  creates the reply plus acks exactly those ids; wide and scoped rules never
  combine. deferred is paused and never terminal, and a retry time remains
  carried by a wrkq promise whose readiness re-pends the envelope through a
  derived, event-free transition. Only presented reply_required envelopes gate
  turn end.

  Membership is identity and attendance, never delivery and never an ACL, and is
  sourced only from spoke, addressed, and joined — never derived from wrkq
  fields. Attendance is the latest presentation receipt per member; scope-less
  principals have none. Presentation receipts are the sole join between wrkq's
  collaboration ledger and HRC's execution world, hold every HRC identifier as
  an opaque string, and are exactly-once per drive attempt. Room, member, and
  envelope activity rides the EXISTING wrkq event ledger, with member events
  logged against their room; `--state-only` continues to exclude all of it.
authority:
  repo: wrkq
  surface: rooms/envelopes/room_members/envelope_presentations schema, wrkq.room.* and wrkq.envelope.* RPC methods, room and envelope event-log rows, collaboration webhook projections, @wrkq/client, and wrkc
consumers:
  - agents saying and replying through wrkc
  - "HRC's kicker, presentation, and stop-hook (wrkq.envelope.present / pendingView / roundEnded)"
  - ACP timeline and mobile history surfaces through @wrkq/client
  - container-scoped webhook subscribers waking on envelope.created
  - "wrkq monitor watch|wait over R- and EN- selectors"
