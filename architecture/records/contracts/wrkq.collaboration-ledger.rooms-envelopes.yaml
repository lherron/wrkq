last_verified:
  date: 2026-09-02
  evidence: T-07871 durability bundle green under just verify; named expiry, withdrawal, scoped-discharge, CLI, migration, and SDK contract tests pin the additive admission surface. Promote to active when waves 2 and 3 prove the consumer side.
enforced_by: "wave 1 ledger/routing bundle; promote to active only after the HRC consumer and ACP cutover guards exist"
reopen_when:
  - one envelope acquires multiple addressees, or a fan-out sibling's disposition can reach another sibling
  - a derived room acquires a friendly id, or a room key stops being its work identity
  - a room property becomes a send gate, notify or reply_required is excluded from summon, or reply_required is excluded from the stop-hook read
  - room activity ceases to be one total, first-match projection over max(opened_at, newest envelope, newest member join)
  - membership becomes derived from a wrkq field, or membership starts gating delivery or reads
  - deferred becomes terminal, or a defer retry stops being carried by a wrkq promise
  - delivery stops being immutable store-only intent or wrkq begins routing hold
  - expiry uses a client clock, timer, or sweeper instead of server-clock observation materialization
  - presentation and withdrawal cease to serialize, or scoped discharge ceases to be atomic with reply creation
  - a presentation receipt becomes anything other than opaque HRC join data, or stops being exactly-once per drive attempt
  - room, member, or envelope activity leaves the shared wrkq event ledger for a separate stream
  - the envelope id prefix changes, or EN- collides with another addressable wrkq id kind
