id: wrkq.simple-task.operator-resolution
kind: contract
status: active
owner_project: wrkq
scope: wrkq-simple-task@2/@3 operator_required recovery lane
predicate: >
  `wrkq-simple-task@2` and `wrkq-simple-task@3` expose exactly one supervisor
  recovery transition from `status=waiting, phase=operator_required`:
  `operator_resolved`. The transition requires latest direct
  `operator_resolution` evidence, a `note` evidence kind producible by
  `supervisor`, with `facts.resolution` in `resume_ready|cancelled|close` and a
  free-form optional summary.
  `resume_ready` moves only to `active/ready` and sets the wrkq task state back
  to `open`; `cancelled` moves to `closed/cancelled` and sets the wrkq task
  state to `cancelled`; `close` moves to `closed/done` and sets the wrkq task
  state to `completed`. It never resumes directly to implemented/done except
  through the terminal-success `close` outcome, and never rewrites prior run
  terminal states or previous operator_required evidence. Resolution does not
  perform transition-id-specific cleanup of supervisor effects.
authority:
  repo: wrkq
  surface: internal/workflow built-in template, wrkf evidence/transition/effect surfaces
consumers:
  - wrkf action runners recovering operator_required instances
  - supervisors resolving out-of-band operator truth
source:
  - internal/workflow/builtins/wrkq-simple-task-v2.workflow.json
  - internal/workflow/builtins/wrkq-simple-task-v3.workflow.json
  - internal/workflow/builtin.go
  - internal/workflow/action_next.go
  - internal/workflow/service.go
  - internal/workflow/ledger.go
  - internal/workflow/operator_resolution_test.go
  - hrcchat#12358
required_tests:
  - TestBuiltinSimpleTaskOperatorResolutionContract
  - TestOperatorResolvedNoEvidenceGate
  - TestOperatorResolvedResumeAndCancelPaths
  - TestOperatorResolvedClosePath
  - TestOperatorResolvedExistingWedgeRecoversAfterBuiltinSupersede
  - go test ./internal/workflow
last_verified:
  date: 2026-07-05
  evidence: "go test ./internal/workflow -run 'TestBuiltinSimpleTask(V2ExecutableActionsValidate|V3BatchLandingContract|OperatorResolutionContract)|TestOperatorResolved|TestActionNextV3LandingCandidateBindsPRVerifiedSource|TestSettleActionV3|TestActionNextV2CandidatesByPhaseAndReadOnly'"
reopen_when:
  - operator_required has no supervisor operator_resolved transition in @2 or @3
  - operator_resolved can run without operator_resolution evidence
  - resume_ready moves anywhere other than active/ready or sets task state other than open
  - cancelled moves anywhere other than closed/cancelled or sets task state other than cancelled
  - close moves anywhere other than closed/done or sets task state other than completed
  - operator_resolved gains transition-id-specific supervisor effect cleanup
supersedes: []
superseded_by: null
