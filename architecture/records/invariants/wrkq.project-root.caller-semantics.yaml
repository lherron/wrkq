id: wrkq.project-root.caller-semantics
kind: invariant
status: active
owner_project: wrkq
scope: project-root path/selector scoping across CLI surfaces
predicate: >
  All path/selector-taking production CLI commands in internal/rpccli must
  transform raw user arguments through the neutral
  internal/projectroot implementation BEFORE constructing RPC params or store
  lookups:

    raw args
      + config.Load project-root precedence (WRKQ_PROJECT_ROOT / ASP_PROJECT /
        .env.local / config.yaml)
      + --project override (resolved against the DB)
      + per-command defaultToRoot
      + ID/UUID/sequence/`t:`/`c:`-prefix exemptions
      -> effective selector/path

  RPC methods receive ONLY effective selectors/paths. They must NOT inspect
  WRKQ_PROJECT_ROOT, ASP_PROJECT, or --project — project-root scoping is caller
  semantics, not a server read-model concern. There is exactly ONE implementation
  of this transform; rpccli may wrap it but must not fork it.
authority:
  repo: wrkq
  surface: production internal/rpccli caller layer over the JSON-RPC boundary
enforced_by: internal/projectroot (single source of truth) + rpccli scoper call sites
exception_channel: "// ARCH-EXCEPTION(T-id): <reason> at the bypassing call site"
source:
  - internal/projectroot/projectroot.go      # the one transform + ResolveProjectFlag
  - internal/rpccli/scope.go                  # mirror scoper, built in openMirror
required_tests:
  - internal/projectroot/projectroot_test.go            # TestTransform (pure transform guard)
  - internal/rpccli/parity_test.go                      # production contract pr/* (WRKQ_PROJECT_ROOT, ASP_PROJECT, --project; ls + read selectors + mutations)
  - internal/rpccli/importguard_test.go                 # TestCoreRuleImportGuard + TestLegacyCLIPackageRemoved
last_verified:
  date: 2026-07-21
  evidence: "T-06762 removed the legacy transform wrappers; rpccli project-root parity and no-regrowth guards plus full verify green."
reopen_when:
  - a new path/selector-taking mirror command bypasses the scoper
  - the project-root precedence or exemption rules change
  - an RPC method begins reading project-root env/flags directly
supersedes: []
superseded_by: null
