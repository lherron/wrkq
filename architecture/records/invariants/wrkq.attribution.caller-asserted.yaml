id: wrkq.attribution.caller-asserted
kind: invariant
status: active
owner_project: wrkq
scope: what caller attribution means, and what may be decided on it, across every wrkq RPC method
predicate: >
  Caller attribution is asserted by the caller, never authenticated. On every
  method, principalRef, scopeRef, idempotencyKey, and envelope meta are taken
  from the request as supplied and stored unchanged. Node tokens authenticate
  a NODE (nodeauth.FromContext), not the agent principal speaking through it:
  any caller on an authenticated node can write as any agent:<id>.

  Consequently no wrkq check keyed on a caller-asserted identity is a security
  boundary. The WRKQ_FORBIDDEN guards (only the addressee may ack/defer/reply,
  only the sender may withdraw, only the promise owner may mutate, onBehalf
  for another owner) are coordination guards that stop honest mistakes; they
  do not stop a caller who asserts the right principal. No feature may treat
  an envelope's `from`, a comment's author, or any *_principal_ref /
  *_scope_ref column as proof of who acted, and no new authorization decision
  may be keyed on them. A feature that needs proof of authorship needs a
  server-attributed provenance field derived from an authenticated
  credential, which does not exist today and requires its own design.
authority:
  repo: wrkq
  surface: every wrkqapi method that reads caller attribution; internal/nodeauth token resolution on the wrkqd transport
enforced_by: "Accepted constraint recorded from T-07716 (Lance ruling 2026-09-27): there is no authenticated principal, so the property is enforced by review — a design that keys authorization or provenance on caller-asserted identity is rejected and must first design server-attributed provenance"
exception_channel: "// ARCH-EXCEPTION(T-id): <reason> at the bypassing call site"
source:
  - internal/nodeauth/nodeauth.go              # tokens resolve to a node id only; nothing maps a token to an agent principal
  - internal/wrkqapi/api.go                    # attributionFor validates the GRAMMAR of the asserted principal, not its truth
  - internal/wrkqapi/rooms.go                  # addressee/sender WRKQ_FORBIDDEN guards compare against the asserted principal
  - internal/wrkqapi/promises.go               # owner/onBehalf WRKQ_FORBIDDEN guards compare against the asserted principal
  - internal/wrkqapi/errors.go                 # NewForbiddenError: a coordination refusal, not an authentication result
required_tests:
  - internal/nodeauth/nodeauth_test.go         # TestParseSpecResolvesTokenToExactlyOneNode: a token names a node, never a principal
  - internal/wrkqapi/rooms_test.go             # addressee/sender guards refuse a mismatched asserted principal
  - internal/wrkqapi/promises_test.go          # owner guard refuses a mismatched asserted principal
last_verified:
  date: 2026-09-27
  evidence: "T-07716: EN-01357 authored by agent:clod carries meta.origin=discord; `wrkc say --idempotency-key` accepts arbitrary values; nodeauth resolves tokens to node ids only (re-read at 986d5c9)."
reopen_when:
  - wrkqd gains a per-principal credential or any transport-authenticated agent identity
  - a feature proposes authorization, audit, or provenance keyed on caller-asserted principalRef/scopeRef/meta
  - a server-attributed provenance field is designed
supersedes: []
superseded_by: null
