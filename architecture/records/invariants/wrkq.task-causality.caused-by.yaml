  - internal/wrkqapi/types.go
  - internal/wrkqapi/catview.go
  - internal/wrkqapi/findlistview.go
  - internal/rpccli/set.go
  - internal/rpccli/find.go
required_tests: []
last_verified: null
reopen_when:
  - caused_by is implemented through task_relations or opaque task metadata
  - causal edges affect blocker, hierarchy, residency, or recursive mutation semantics
  - caused_by changes bypass task etag/history/webhook attribution
  - hard-purging a causing task silently removes another task's projected caused_by
  - legacy CLI and RPC-backed compatibility projections diverge on field shape, order, clear semantics, or find filtering
