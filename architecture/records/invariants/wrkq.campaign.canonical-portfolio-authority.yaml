required_tests:
  - TestCampaignPortfolioMigrationWidensStateAndPreservesContainerRows
  - TestCampaignDraftLifecycleLabelsAndMembership
  - TestCampaignDraftCancellationAndTerminalAdmissionSeal
  - TestCampaignPortfolioCompleteAggregateSnapshot
  - TestCampaignWebhookPostCommitPayloadInheritanceAndClassIsolation
  - TestCatViewInCatalogs
last_verified:
  date: 2026-07-23
  evidence: "T-06826 focused migration/store/API/RPC/CLI/client guards plus installed daemon-backed smoke green."
reopen_when:
  - any non-wrkq store becomes a campaign lifecycle, membership, or label write authority
  - a new task admission path can enter a terminal campaign or bypass exclusivity
  - campaign labels diverge from task-label value semantics
  - campaignPortfolio paginates, includes member identities, or is assembled from multiple snapshots
  - portfolio counts, footprint, or lastActivityAt become stored display fields
  - timeline member grouping differs from portfolio footprint project identity
  - owner, scheduling, or priority becomes a canonical campaign field
