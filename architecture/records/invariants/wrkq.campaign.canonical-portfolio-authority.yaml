id: wrkq.campaign.canonical-portfolio-authority
kind: invariant
status: active
owner_project: wrkq
scope: campaign lifecycle, exclusive membership, labels, and producer-owned portfolio projections
predicate: >
  A wrkq campaign container is the canonical portfolio resource. Its independent
  lifecycle is draft, active, completed, or cancelled; container kind and archive
  state are not lifecycle fields. Draft campaigns may have resident or explicitly
  enrolled tasks. Effective membership is exclusive resident-or-enrolled, and the
  task campaign field is the only explicit enrollment authority. Terminal
  campaigns retain existing members and permit departure but reject every new
  resident or enrolled admission path, including create, move, copy, and task
  update.

  Campaign labels are the existing task-label value type exactly: ordered string
  arrays preserve whitespace, case, duplicates, and order; an empty array clears
  and the projection is never null. Campaigns have no canonical owner, schedule,
  or priority fields. Generic wrkq.container.update remains restricted to
  slug/title.

  wrkq.container.campaignPortfolio is the producer-owned collapsed portfolio
  read model. It returns the complete selected set in one read transaction,
  without pagination or member identities; omitted filters select unarchived
  draft+active campaigns, ordered by createdAt descending then UUID ascending.
  Counts and top-level project footprint derive from current effective members.
  lastActivityAt is exactly max(campaign.updated_at,
  effective-member.updated_at). wrkq.container.timelineView is the lazy member
  detail projection and returns member project identity, footprint, labels, and
  the same activity definition. Downstream Epic/portfolio displays are consumer
  views, not mutation or dual-write authorities.
authority:
  repo: wrkq
  surface: campaign store transactions + wrkqapi portfolio/timeline methods + @wrkq/client
enforced_by: "migration 000050; shared effective-membership validator on every admission path; dedicated campaign lifecycle methods; transaction-scoped campaignPortfolio/timelineView read models; workrpc schema catalog"
exception_channel: "// ARCH-EXCEPTION(T-id): <reason> at the bypassing call site"
