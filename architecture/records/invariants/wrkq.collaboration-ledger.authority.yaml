id: wrkq.collaboration-ledger.authority
kind: invariant
status: active
owner_project: wrkq
scope: durable agent-collaboration rooms, envelopes, obligations, attendance, and their HRC/ACP consumer boundary
predicate: >
  wrkq is the sole durable authority for collaboration state that must survive
  every agent runtime: work-keyed rooms, single-addressee envelopes, fan-out
  groups, reply obligations, membership, attendance, and presentation receipts.
  Task addressing coalesces strictly to the task's effective campaign when one
  exists; campaign-adorned and project-kind containers resolve to their
  respective rooms, while other container kinds are not room authorities. Every
  mutation preserves wrkq.attribution.caller-principal-exact and human
  participants use the existing scope-less agent:<id> principal grammar.

  Rooms have no collaboration lifecycle that can gate traffic. A say into a
  known, resolvable room is never refused because its work is terminal, its
  activity is stale, or it carries the hidden discovery label; obligations in
  every such room enter the same kicker and stop-hook reads. Work and activity
  are read-time projections only. last_activity is the maximum of room opened,
  envelope created, and member joined timestamps, and activity is the first
  matching value: stale for terminal work older than four hours, active when
  younger than twenty-four hours, and quiet otherwise. The hidden label affects
  default listing only.

  HRC owns execution state and actuation only: sessions, generations, runtimes,
  runs, presentation formatting, kicker drive attempts, stop-hook enforcement,
  and summon/placement. HRC consumes the wrkq ledger and may write its runtime
  identifiers only as opaque presented_to join data; it holds no second durable
  collaboration copy. wrkq never imports HRC, and wrkc must persist, read, and
  monitor collaboration with every HRC daemon unavailable.

  A bodyless HRC pending-reply intent for one completed drive attempt is
  execution actuation, not a second collaboration copy. For a successful drive
  that presented exactly one envelope, or one fan-out group from one sender,
  HRC may derive the reply from its canonical dispatcher turn-response
  projection and emit it through the existing ordinary say surface with exact
  seat-principal attribution, deterministic auto-reply:<driveAttemptId>
  idempotency, and auto: turn_final provenance. wrkq remains authoritative for
  both envelope discharge and whether that say committed. After every uncertain
  write outcome, HRC establishes commitment only by reading the authoritative
  envelope row bearing that exact sender and idempotency key; the HRC intent
  never stores the reply body or decides room, envelope, or obligation state.
  The non-atomic discharge-read/plain-say race is limited to and accepted by
  wrkq.collaboration-ledger.auto-reply-manual-race.

  ACP may persist a rebuildable mobile presentation projection of immutable
  envelope identity, content, addressing, and creation time, fenced by the wrkq
  ledger incarnation. That projection is not collaboration authority, excludes
  mutable obligation, envelope-state, attendance, and presentation-receipt
  state, and is retired rather than combined across a wrkq ledger replacement.

  Cross-node collaboration travels through the shared canonical wrkqd ledger.
  After the fleet-complete cutover, HRC federation retains birth, placement, and
  summon authority but no durable message transport or message outbox authority.
authority:
  repo: wrkq
  surface: room/envelope/member store transactions, wrkq workrpc methods, @wrkq/client, and wrkc
enforced_by: T-07612 rev 2 ratified boundary, its rev 3 amendment revision 2, the approved T-07789 auto-reply amendment, and the amended ledger/routing and consumer/cutover evidence bundles
exception_channel: "// ARCH-EXCEPTION(T-id): <reason> at the collaboration mutation, routing, or consumer boundary"
source:
  - architecture/adr/0002-wrkq-owns-durable-agent-collaboration.md
  - architecture/records/contracts/wrkq.collaboration-ledger.bounded-observation.yaml
  - architecture/records/invariants/wrkq.attribution.caller-principal-exact.yaml
  - architecture/records/invariants/wrkq.campaign.canonical-portfolio-authority.yaml
  - architecture/records/invariants/wrkq.rpc.remote-transport-locator.yaml
  - architecture/records/risks/wrkq.collaboration-ledger.auto-reply-manual-race.yaml
  - wrkq:T-07789
required_tests:
  - T-07612 ledger and routing bundle
  - T-07612 consumer and cutover bundle
last_verified:
  date: 2026-08-31
  evidence: Daedalus source-grounded architecture approval of the T-07789 auto-reply amendment; implementation gates pending.
reopen_when:
  - any non-wrkq store becomes a durable room, envelope, obligation, membership, attendance, or presentation-receipt authority
  - wrkq or wrkc acquires an HRC runtime dependency
  - one envelope acquires multiple addressees or one addressee can disposition another addressee's fan-out sibling
  - work-key routing stops strict campaign coalescing or project and campaign room authority diverges from canonical container state
  - HRC federation regains a durable collaboration-message path after cutover
  - the division between wrkq collaboration authority and HRC execution, presentation, or summon/placement authority changes
  - an ACP projection persists mutable collaboration state or survives a wrkq ledger-incarnation replacement
  - room work, activity, or visibility becomes a send gate or excludes an addressed obligation from the uniform kicker and stop-hook reads
  - room activity ceases to be one total, first-match projection over the specified last_activity clock
  - an HRC auto-reply intent stores collaboration content, becomes authoritative for mint or discharge state, or stops verifying uncertain writes against committed wrkq envelope rows
  - automatic reply scope expands beyond one envelope or one same-sender fan-out group per driven turn
  - the accepted discharge-read/plain-say duplicate window changes
