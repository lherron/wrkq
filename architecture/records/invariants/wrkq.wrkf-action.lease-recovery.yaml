id: wrkq.wrkf-action.lease-recovery
kind: invariant
status: active
owner_project: wrkq
scope: wrkf.action lease expiry
predicate: >
  Coordinator-owned wrkf.action runs may opt into durable leases. A leased active
  action run carries one current lease token, non-secret owner/expiry/heartbeat
  audit fields, and rejects heartbeat, complete, fail, or settle attempts unless
  the caller presents current authority. Lease TTL expiry only makes a claim
  contestable: no timer, CLI command, RPC method, or service path terminalizes
  the run, clears its claim fields, stamps operator_required, or synthesizes
  failure evidence at expiry time. wrkf also owns workspace leases keyed by the
  canonical resolved physical worktree root. Expiry alone does not release or
  mutate a workspace lease record.
authority:
  repo: wrkq
  surface: wrkf.action.* plus wrkf.workspace.* over workflow_runs and workflow_workspace_leases
source:
  - internal/db/migrations/000034_workflow_action_leases.sql
  - internal/db/migrations/000038_workflow_workspace_leases.sql
  - internal/workflow/action.go
  - internal/workflow/workspace_lease_test.go
  - internal/cli/daemon.go
  - internal/wrkfapi/action.go
  - internal/workrpc/registry.go
  - internal/workrpc/wrkfworkspace_acceptance_test.go
required_tests:
  - TestExpiredWorkspaceBoundActionRemainsActive
  - TestWrkfActionWorkspaceExpiryDoesNotTerminalizeRPC
last_verified:
  date: 2026-07-12
  evidence: "go test ./internal/workflow -run TestExpiredWorkspaceBoundActionRemainsActive and go test ./internal/workrpc -run TestWrkfActionWorkspaceExpiryDoesNotTerminalizeRPC green; installed wrkf CLI/RPC smoke confirms reap surfaces are absent"
reopen_when:
  - any expiry-time process mutates or terminalizes an action run
  - any expiry-time process releases or mutates a workspace lease
  - an explicit reaping API is introduced
supersedes: []
superseded_by: null
