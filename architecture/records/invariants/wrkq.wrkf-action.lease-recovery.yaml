id: wrkq.wrkf-action.lease-recovery
kind: invariant
status: active
owner_project: wrkq
scope: wrkf.action coordinator-owned recovery
predicate: >
  Coordinator-owned wrkf.action runs may opt into durable leases. A leased active
  action run carries one current lease token, non-secret owner/expiry/heartbeat
  audit fields, and rejects heartbeat, complete, fail, or settle attempts unless
  the caller presents the current unexpired authority. Expired legacy or
  side-effect-free action runs are terminalized operationally failed with
  run-linked failure evidence. Expired v2 claimed runs with possible side effects
  or external/workspace bindings are terminalized operator_required with
  run-linked failure evidence; recovery must not invent semantic success. Legacy
  unleased active actions remain valid blockers unless a caller explicitly
  supplies a legacyActiveBefore cutoff to the reap path.
authority:
  repo: wrkq
  surface: wrkf.action.* over workflow_runs
source:
  - internal/db/migrations/000034_workflow_action_leases.sql
  - internal/workflow/action.go
  - internal/wrkfapi/action.go
  - internal/workrpc/registry.go
required_tests:
  - go test ./internal/workflow
  - "go test ./internal/workrpc -run 'Action|WrkfAction'"
last_verified:
  date: 2026-07-01
  evidence: "go test ./internal/workflow -run 'ActionReap|Recovery|SourceBinding'; go test ./internal/workrpc -run 'WrkfAction|Reap|Claim|Settle' green for action lease schema, token guards, settle authority, and v2 operator_required recovery"
reopen_when:
  - wrkf.action lease token exposure rules change
  - action reaping stops terminalizing expired legacy/side-effect-free active runs as failed
  - v2 claimed runs with possible side effects stop recovering as operator_required
  - legacy unleased active action blocker semantics change
supersedes: []
superseded_by: null
