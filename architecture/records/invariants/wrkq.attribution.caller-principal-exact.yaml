id: wrkq.attribution.caller-principal-exact
kind: invariant
status: active
owner_project: wrkq
scope: write-attribution principal resolution for every wrkqapi mutation crossing the wrkq RPC boundary
predicate: >
  Every wrkq-core write records an exact caller principal (`agent:<id>`) plus
  optional scope before any write/no-op/dry-run success. Caller attribution is
  principal-only: accepted sources are --principal-ref / --as /
  WRKQ_PRINCIPAL_REF / product-specific explicit principal envs /
  config default_principal_ref as either agent:<id> or a full agent ScopeRef
  reduced to agent:<id>, plus validated runtime scope-derived agents resolved
  by caller-owned scope order --scope > AGENT_SCOPE_REF > ASP_SCOPE_REF >
  ASP_HANDLE > ASP_AGENT_ID+ASP_PROJECT. Missing identity is WRKQ_VALIDATION.

  The runtime never maps to agent:wrkq-system, never accepts system:*,
  actor UUID, A-* friendly IDs, bare caller slugs, WRKQ_ACTOR, WRKQ_ACTOR_ID,
  WRKF_ACTOR, or config default_actor as caller attribution, never reads the
  actors table for attribution, and never writes *_actor_uuid columns. Legacy
  wrkf workflow actors are never wrkq-core caller attribution defaults.
authority:
  repo: wrkq
  surface: internal/wrkqapi.API.attributionFor + every wrkqapi mutation call site (the JSON-RPC server, shared by wrkq + wrkf entrypoints)
enforced_by: "internal/wrkqapi/api.go attributionFor returns (Attribution, error); every wrkqapi write threads that error so missing/invalid principal identity is WRKQ_VALIDATION before any write/event/no-op/dry-run; T-05381 principal-only ruling"
exception_channel: "// ARCH-EXCEPTION(T-id): <reason> at the bypassing call site"
source:
  - internal/wrkqapi/api.go                    # attributionFor: agent:<id> or full agent ScopeRef input; empty/invalid → WRKQ_VALIDATION
  - internal/attribution/principal.go          # Resolve / NormalizeCanonical (agent ScopeRef → agent:<id>) / ValidatePrincipalRef (stored principal grammar = agent:<id>)
  - internal/scope/resolve.go                  # caller-owned runtime scope order: --scope > AGENT_SCOPE_REF > ASP_SCOPE_REF > ASP_HANDLE > ASP_AGENT_ID+ASP_PROJECT
  - internal/workrpc/bootstrap/bootstrap.go    # default_principal_ref is optional; empty means no ambient system fallback
  - internal/wrkfcli/root.go                   # wrkf splits workflow actor fallback from wrkq-core default principal
  - internal/wrkqapi/webhooks.go               # validates actor BEFORE the no-change branch (no successful no-op for an invalid actor)
  - internal/wrkqapi/projectroots.go           # setRoot resolves canonical attribution before its sole write/event path
  - internal/workrpc/project_root_test.go       # setRoot row+event exact attribution and invalid-identity no-op guards
required_tests:
  - internal/attribution/principal_test.go     # principal-only Resolve precedence; product principal envs; full ScopeRef flags reduce; legacy actor env/config ignored; bare --as rejected
  - internal/scope/resolve_test.go             # AGENT_SCOPE_REF precedence and disagreement diagnostics
  - internal/wrkfcli/root_test.go              # wrkf workflow actor fallback does not become wrkq-core default attribution
  - internal/workrpc/webhook_test.go           # TestWrkqWebhookAdd_ExactAttribution (changed-add exact + invalid reject) + TestWrkqWebhook_NoChangeInvalidActorRejected (duplicate add / missing remove invalid actor → WRKQ_VALIDATION, etag unchanged, no event)
  - internal/workrpc/commentdelete_mode_test.go # TestCommentAdd_ExactAttribution (non-webhook producer records the caller principal exactly)
  - TestProjectRootSetRootCanonicalAttributionAndInvalidIdentityNoOp
  - internal/rpccli/parity_test.go             # webhook/add-with-principal mutates row (cross-binary updated_by_principal_ref parity)
last_verified:
  date: 2026-07-14
  evidence: "T-05381 principal-only suite remains green; T-06366 real-RPC setRoot guard verifies canonical agent attribution on row+event and invalid bare identity as an atomic no-op; Daedalus focused rerun green at 97a3a71."
reopen_when:
  - attributionFor stops returning an error for missing/invalid principal identity
  - any wrkqapi mutation returns a successful response (including no-change/dry-run) without validating caller principal identity
  - a system:* or legacy actor selector source is reintroduced for wrkq-core caller attribution
  - the stored principal grammar (attribution.ValidatePrincipalRef = agent:<id>) changes
supersedes: []
superseded_by: null
