id: wrkq.task-view.caller-state-selection
kind: invariant
status: proposed
owner_project: wrkq
scope: wrkq.task.treeView and wrkq.task.lsView state selection and tree rollup aggregation
predicate: >
  Callers specify task visibility through a required states selector, independently
  of row lifecycle and empty-container pruning. Missing or empty states and unknown
  state members are validation errors; any explicitly selects every task state.
  The human-facing CLI owns the no-flags working set draft, open, in_progress and
  sends it explicitly. The server owns filtering execution, traversal, and pruning.
  TreeViewParams and LsListViewParams participate in the existing protocol schema
  catalog so incompatible old servers are refused at client initialization.

  Tree AllTasksCompleted must not change because the task-state selector or display
  pruning excludes unfinished work. Direct-task counters precede visibility
  filtering; recursive completion includes every built resident child container,
  whether displayed or pruned. Task closure remains IsArchived OR IsDeleted OR
  State == completed; cancelled does not become closed. External task backlinks
  do not become resident rollup inputs. This decision does not change traversal
  depth, task residency, or campaign-portfolio contracts.
authority:
  repo: wrkq
  surface: wrkqapi task view projections, rpccli caller policy, and workrpc schema catalog
enforced_by: >
  Planned T-08216 tree-state-selector implementation, approved design revision 3.
  Not yet implemented or verified; activation awaits implementation evidence.
source:
