id: wrkq.task-claim.authority
kind: invariant
status: active
owner_project: wrkq
scope: cross-node task holdership, takeover fencing, and claimed-task completion
predicate: >
  A task claim is one canonical-home SQLite transaction. The server accepts only
  a verified per-node bearer identity, derives claimed_node from that identity,
  validates an exact task-scoped agent ScopeRef whose agent matches the caller
  principal, and atomically records the full holder tuple while setting the task
  in_progress. The durable claim_generation starts at zero and can only increase;
  release clears the tuple but never resets generation. Takeover always mints a
  new token and increments generation. Completion of a claimed task validates
  principal, exact scope, authenticated node, generation, and token inside the
  same BEGIN IMMEDIATE transaction as completion. Superseded holders cannot
  validate or complete but may append comments. Claims have no lease or TTL.
authority:
  repo: wrkq
  surface: wrkqd authenticated workrpc boundary + wrkqapi task claim/completion transactions
enforced_by: "migration 000048 tuple/generation triggers; nodeauth request context; TaskClaim, TaskClaimValidate, TaskRelease, and TaskUpdate transactional precondition"
exception_channel: "// ARCH-EXCEPTION(T-id): <reason> at the bypassing call site"
source:
  - internal/db/migrations/000048_task_claim_authority.sql
  - internal/nodeauth/nodeauth.go
  - internal/wrkqd/daemon.go
  - internal/wrkqd/daemon_workrpc_test.go
  - internal/wrkqapi/claims.go
  - internal/wrkqapi/claims_test.go
  - internal/wrkqapi/tasks.go
  - internal/store/tasks.go
  - internal/rpccli/claim.go
required_tests:
  - TestDaemonClaimDerivesNodeFromBearerIdentity
  - TestTaskClaimRequiresVerifiedNodeAndAtomicallySelectsOneWinner
  - TestTaskClaimTakeoverFencesOldHolderButAllowsComments
  - TestTaskReleasePreservesGenerationAndFiltersExposeHoldership
last_verified:
  date: 2026-07-20
  evidence: "T-06623 just verify green: daemon-boundary bearer identity, real-SQLite concurrency, takeover/completion fencing, release, projections, error mapping, architecture/doc gates, and typed-client RPC integration."
reopen_when:
  - claimed_node can be supplied by an RPC caller or a shared/unknown bearer can claim
  - a claim is acquired outside one canonical-home transaction
  - claim_generation can decrease or release resets it
  - a stale generation can pass claimValidate or complete a claimed task
  - comments become holder-guarded, or completion ceases to be holder-guarded
  - a claim lease or TTL is introduced
supersedes: []
superseded_by: null
